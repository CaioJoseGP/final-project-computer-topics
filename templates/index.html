<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universidade XYZ - Admissões</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-banner {
            background-color: #343a40;
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
        }
        .header-banner h1 { margin: 0; margin-left: 20px; font-weight: 300; }
        .loading { display: none; color: #dc3545; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header-banner">
    <img src="https://via.placeholder.com/80x80/6c757d/ffffff?text=CAP" alt="Logo" class="rounded">
    <h1>Universidade XYZ</h1>
    <div class="ms-auto me-4">
        <a href="#" class="text-white text-decoration-none d-block">Home</a>
        <a href="#" class="text-white text-decoration-none text-muted">Students list</a>
    </div>
</div>

<div class="container mt-4">
    <h2>All students</h2>
    
    <div id="loadingIndicator" class="loading">
        Carregando dados (Processamento intenso de CPU em andamento...)
    </div>

    <table class="table table-striped table-hover align-middle border">
        <thead class="table-light">
            <tr>
                <th>Name</th>
                <th>Address</th>
                <th>City</th>
                <th>State</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
            </tbody>
    </table>

    <button class="btn btn-success" onclick="openModal()">Add a new student</button>
</div>

<div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Student Info</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <input type="hidden" id="studentId">
                    <div class="mb-2"><label>Name</label><input type="text" class="form-control" id="name" required></div>
                    <div class="mb-2"><label>Address</label><input type="text" class="form-control" id="address"></div>
                    <div class="mb-2"><label>City</label><input type="text" class="form-control" id="city"></div>
                    <div class="mb-2"><label>State</label><input type="text" class="form-control" id="state"></div>
                    <div class="mb-2"><label>Email</label><input type="email" class="form-control" id="email"></div>
                    <div class="mb-2"><label>Phone</label><input type="text" class="form-control" id="phone"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="saveStudent()">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const apiUrl = '/api/students';
    const studentModal = new bootstrap.Modal(document.getElementById('studentModal'));

    async function loadStudents() {
        document.getElementById('loadingIndicator').style.display = 'block';
        document.getElementById('studentTableBody').innerHTML = '';
        
        try {
            const response = await fetch(apiUrl);
            const data = await response.json();
            
            let rows = '';
            data.forEach(student => {
                // Escapando dados no frontend simples
                rows += `<tr>
                    <td><strong>${student.name}</strong></td>
                    <td>${student.address}</td>
                    <td>${student.city}</td>
                    <td>${student.state}</td>
                    <td>${student.email}</td>
                    <td>${student.phone}</td>
                    <td>
                        <button class="btn btn-sm btn-info text-white" onclick="editStudent(${student.id}, '${student.name}', '${student.address}', '${student.city}', '${student.state}', '${student.email}', '${student.phone}')">edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteStudent(${student.id})">x</button>
                    </td>
                </tr>`;
            });
            document.getElementById('studentTableBody').innerHTML = rows;
        } catch (error) {
            console.error("Erro ao carregar dados:", error);
        } finally {
            document.getElementById('loadingIndicator').style.display = 'none';
        }
    }

    function openModal() {
        document.getElementById('studentForm').reset();
        document.getElementById('studentId').value = '';
        document.getElementById('modalTitle').innerText = 'Add a new student';
        studentModal.show();
    }

    function editStudent(id, name, address, city, state, email, phone) {
        document.getElementById('studentId').value = id;
        document.getElementById('name').value = name !== 'null' ? name : '';
        document.getElementById('address').value = address !== 'null' ? address : '';
        document.getElementById('city').value = city !== 'null' ? city : '';
        document.getElementById('state').value = state !== 'null' ? state : '';
        document.getElementById('email').value = email !== 'null' ? email : '';
        document.getElementById('phone').value = phone !== 'null' ? phone : '';
        document.getElementById('modalTitle').innerText = 'Edit student';
        studentModal.show();
    }

    async function saveStudent() {
        const id = document.getElementById('studentId').value;
        const payload = {
            name: document.getElementById('name').value,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            state: document.getElementById('state').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${apiUrl}/${id}` : apiUrl;

        await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        studentModal.hide();
        loadStudents();
    }

    async function deleteStudent(id) {
        if(confirm('Are you sure you want to delete this student?')) {
            await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
            loadStudents();
        }
    }

    // Carrega a tabela assim que a página abre
    window.onload = loadStudents;
</script>
</body>
</html>
